server.port=${SIMPLE_SHOP_ITEM_SERVICE_PORT:8083}

# See https://docs.spring.io/spring-boot/reference/features/logging.html
# Sets the minimal log level for the whole app.
logging.level.root=${SIMPLE_SHOP_ITEM_SERVICE_LOG_LEVEL_ROOT:INFO}

# Regular DB user after startup with Data Manipulation Language (DML) rights
# (SELECT, INSERT, UPDATE, DELETE, ...)
spring.datasource.url=${SIMPLE_SHOP_ITEM_SERVICE_DB_URL}
spring.datasource.username=${SIMPLE_SHOP_ITEM_SERVICE_DB_USERNAME}
spring.datasource.password=${SIMPLE_SHOP_ITEM_SERVICE_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway DB migration tool user with Data Definition Language (DDL) right
# (CREATE, ALTER, DROP, TRUNCATE, ...)
spring.flyway.enabled=${SIMPLE_SHOP_ITEM_SERVICE_ENABLE_FLYWAY:true}
spring.flyway.user=${SIMPLE_SHOP_ITEM_SERVICE_DB_ADMIN_USERNAME}
spring.flyway.password=${SIMPLE_SHOP_ITEM_SERVICE_DB_ADMIN_PASSWORD}
logging.level.org.flywaydb=DEBUG

# TODO spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.simple_shop.item_service.shared.persistence.CamelToPascalNamingStrategy

# SeaweedFS / S3
# Remove app.storage.* in prod.
app.storage.endpoint=${SIMPLE_SHOP_ITEM_SERVICE_STORAGE_ENDPOINT:http://localhost:8333}
app.storage.bucket-name=${SIMPLE_SHOP_ITEM_SERVICE_STORAGE_BUCKET:item-images}
# Just some dev values so that AWS is happy. Change in prod. 
aws.access-key-id=${SIMPLE_SHOP_ITEM_SERVICE_STORAGE_ACCESS_KEY:access_key_placeholder}
aws.secret-access-key=${SIMPLE_SHOP_ITEM_SERVICE_STORAGE_SECRET_KEY:secret_key_placeholder}
aws.region=${SIMPLE_SHOP_ITEM_SERVICE_STORAGE_REGION:us-east-1}