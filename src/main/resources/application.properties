# See https://docs.spring.io/spring-boot/reference/features/logging.html
# Sets the minimal log level for the whole app.
logging.level.root=${SIMPLE_SHOP_ITEM_SERVICE_LOG_LEVEL_ROOT:INFO}

# Regular DB user after startup with Data Manipulation Language (DML) rights
# (SELECT, INSERT, UPDATE, DELETE, ...)
spring.datasource.url=${SIMPLE_SHOP_ITEM_SERVICE_DB_URL}
spring.datasource.username=${SIMPLE_SHOP_ITEM_SERVICE_DB_USERNAME}
spring.datasource.password=${SIMPLE_SHOP_ITEM_SERVICE_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway DB migration tool user with Data Definition Language (DDL) right
# (CREATE, ALTER, DROP, TRUNCATE, ...)
spring.flyway.enabled=${SIMPLE_SHOP_ITEM_SERVICE_ENABLE_FLYWAY:true}
spring.flyway.user=${SIMPLE_SHOP_ITEM_SERVICE_DB_ADMIN_USERNAME}
spring.flyway.password=${SIMPLE_SHOP_ITEM_SERVICE_DB_ADMIN_PASSWORD}
logging.level.org.flywaydb=DEBUG

