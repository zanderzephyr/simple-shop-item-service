plugins {
    id 'java'
    id 'eclipse'
}

group = 'com.simple-shop'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '25'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}